<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faker | Buezwqwg</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Playfair+Display:ital,wght@0,700;1,700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #fdfdfd;
            --text-color: #1a1a1a;
            --accent-color: #800000;  
            --secondary-color: #555;
            --border-color: #d1d1d1;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Noto Serif SC', 'Georgia', serif;
            line-height: 1.85;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

         
        .top-bar {
            height: 4px;
            background-color: var(--accent-color);
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
        }

         
        .home-link {
            position: absolute;
            top: 20px;
            left: 20px;
            font-family: sans-serif;
            font-size: 0.8rem;
            text-decoration: none;
            color: #999;
            transition: color 0.2s;
        }
        .home-link:hover { color: var(--accent-color); }

         
        .container {
            max-width: 1000px;       
            width: 90%;             
            margin: 30px auto 40px; 
            padding: 0 15px;
            box-sizing: border-box; 
        }

         
        .toc-sidebar {
            position: fixed;
            top: 120px;
            right: 20px;
            width: 240px;
            max-height: 80vh;
            overflow-y: auto;
            font-family: 'Noto Serif SC', serif;
            font-size: 0.85rem;
            color: #666;
            border-left: 2px solid #eee;
            padding-left: 15px;
            display: none; 
            z-index: 90;
        }

        .toc-sidebar h4 {
            font-family: 'Playfair Display', serif;
            margin-top: 0;
            margin-bottom: 10px;
            color: var(--accent-color);
            font-size: 1rem;
        }

        .toc-sidebar nav ul { list-style: none; padding: 0; margin: 0; }
        .toc-sidebar nav ul li { margin-bottom: 8px; line-height: 1.4; }
        .toc-sidebar nav ul ul { padding-left: 15px; margin-top: 5px; }
        .toc-sidebar a { text-decoration: none; color: #888; transition: color 0.2s; }
        .toc-sidebar a:hover { color: var(--accent-color); text-decoration: underline; }

        @media (min-width: 1560px) {
            .toc-sidebar { display: block; }
        }

         
        header {
            text-align: center;
            margin-bottom: 0px;
            border-bottom: 1px solid transparent;
        }

        .journal-meta {
            font-family: 'Playfair Display', serif;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.75rem;
            color: var(--secondary-color);
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            display: inline-block;
            padding-bottom: 5px;
        }

        h1 {
            font-family: 'Playfair Display', 'Noto Serif SC', serif;
            font-size: 2.5rem;
            line-height: 1.2;
            margin: 10px 0 20px 0;
            font-weight: 700;
            color: #000;
        }

        .author-line {
            font-family: 'Noto Serif SC', serif;
            font-style: italic;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 0;
            margin: 30px 0 10px;
            font-size: 0.9rem;
            color: #444;
        }

         
        .content {
            text-align: justify; 
            hyphens: auto;
            font-size: 1.05rem;
        }

        .content p { margin-bottom: 1.6em; }

         
        .content h2, .content h3 {
            font-family: 'Playfair Display', serif;
            color: #000;
            
             
            display: block; 
            text-align: left;
            width: 100%;
            
            margin-top: 2.5em;
            margin-bottom: 1em;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.3em;
        }
        
        .content h2 { font-size: 1.6rem; }
        .content h3 { font-size: 1.2rem; color: var(--accent-color); }

         
        .content h1 a,
        .content h2 a,
        .content h3 a,
        .content h4 a {
            display: none !important;  
        }

         
        .content h1 a:hover,
        .content h2 a:hover,
        .content h3 a:hover {
            color: var(--accent-color) !important;
        }

         
        .content pre {
            text-align: left; 
            background: #f4f4f4;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 0.85rem;
            border: 1px solid #eee;
            font-family: 'JetBrains Mono', monospace;
            margin: 20px auto;
            max-width: 100%;
        }
        
        .content code {
            font-family: 'JetBrains Mono', monospace;
            background: #f4f4f4;
            padding: 2px 4px;
            font-size: 0.9em;
            color: #c7254e;
        }
        .content pre code { color: inherit; background: none; padding: 0; }

         
        blockquote {
            margin: 40px 0;
            padding: 0 40px;
            border-left: none;
            text-align: center;
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            color: var(--secondary-color);
            font-style: italic;
            line-height: 1.4;
        }

         
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 30px 0;
            font-size: 0.9rem;
            font-family: sans-serif;
            text-align: left;
        }

        th {
            border-bottom: 2px solid var(--text-color);
            padding: 10px;
            font-weight: 700;
        }

        td {
            border-bottom: 1px solid var(--border-color);
            padding: 10px;
            color: #444;
        }

         
        img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 30px auto;
        }

        footer {
            margin-top: 100px;
            padding-top: 20px;
            border-top: 3px double var(--border-color);
            font-size: 0.75rem;
            color: #888;
            font-family: sans-serif;
            text-align: center;
        }

        @media print {
            .container { max-width: 100%; margin: 0; }
            .top-bar, .home-link, .toc-sidebar { display: none; }
            body { background: white; }
        }
    </style>
</head>
