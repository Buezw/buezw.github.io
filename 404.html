<script>


window.SiteLang=(function(){
  var fns=[], root=document.documentElement;
  function cur(){ return root.getAttribute('data-lang')==='zh'?'zh':'en'; }
  function apply(){
    var l=cur();
    root.lang = l==='zh'?'zh-CN':'en';
    document.querySelectorAll('[data-zh-ph]').forEach(function(e){ e.placeholder=e.getAttribute('data-'+l+'-ph'); });
    document.querySelectorAll('[data-zh-title]').forEach(function(e){
      if(!e.hasAttribute('data-en-title')) e.setAttribute('data-en-title',e.title);
      e.title=e.getAttribute('data-'+l+'-title');
    });
    var t=document.querySelector('title');
    if(t&&t.getAttribute('data-zh')){ if(!t.hasAttribute('data-en')) t.setAttribute('data-en',document.title); document.title=t.getAttribute('data-'+l); }
    fns.forEach(function(f){ try{f(l);}catch(e){} });
  }
  function set(l){ root.setAttribute('data-lang',l); try{localStorage.setItem('lang',l);}catch(e){} apply(); }
  document.addEventListener('click',function(e){
    var b=e.target.closest('[data-setlang]'); if(b){ set(b.getAttribute('data-setlang')); return; }
    var m=e.target.closest('.more'); if(m){ var c=m.closest('.lf'); if(c) c.classList.add('all'); }
  });
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',apply); else apply();
  return {get:cur,set:set,on:function(f){fns.push(f); f(cur());}};
})();
</script>
<script>
 
(function(){
  var q=document.getElementById('q'), box=document.getElementById('sres');
  if(!q||!box) return;
  var NAMES={"/docs/dive-into-deep-learning/":{"en":"Dive Into Deep Learning","zh":"动手学深度学习"},"/docs/reads/efficientlyinefficient/":{"en":"Efficiently Inefficient","zh":"Efficiently Inefficient"},"/docs/uoft/24f/aps104---engineering-chemistry--materials-science/":{"en":"APS104 Engineering Chemistry \u0026 Materials Science","zh":"APS104 工程化学与材料科学"},"/docs/uoft/24f/aps105---learning-programming-with-c/":{"en":"APS105 Programming with C","zh":"APS105 C 语言程序设计"},"/docs/uoft/24f/ece110---electrical-fundamentals/":{"en":"ECE110 Electrical Fundamentals","zh":"ECE110 电学基础"},"/docs/uoft/24f/mat186---calculus/":{"en":"MAT186 Calculus","zh":"MAT186 微积分"},"/docs/uoft/24f/mat188---linearalgebra/":{"en":"MAT188 Linear Algebra","zh":"MAT188 线性代数"},"/docs/uoft/24f/mie100---dynamics/":{"en":"MIE100 Dynamics","zh":"MIE100 动力学"},"/docs/uoft/25f/advanced-engineering-mathematics/":{"en":"Advanced Engineering Mathematics","zh":"高等工程数学"},"/docs/uoft/25f/digital-systems/":{"en":"Digital Systems","zh":"数字系统"},"/docs/uoft/25f/introduction-to-mathematic-physic/":{"en":"Introduction to Mathematical Physics","zh":"数学物理导论"},"/docs/uoft/25f/introductory-electronics/":{"en":"Introductory Electronics","zh":"电子学导论"},"/docs/uoft/25f/object-oriented-programming-using-c++/":{"en":"Object-Oriented Programming in C++","zh":"C++ 面向对象编程"},"/docs/uoft/26w/ece221---circuit-analysis/":{"en":"ECE221 Circuit Analysis","zh":"ECE221 电路分析"},"/docs/uoft/26w/ece243---computer-organization/":{"en":"ECE243 Computer Organization","zh":"ECE243 计算机组成"},"/docs/uoft/26w/electric-and-magnetic-field/":{"en":"Electric \u0026 Magnetic Fields","zh":"电磁场"},"/docs/uoft/26w/signal-and-systems/":{"en":"Signals \u0026 Systems","zh":"信号与系统"}};
  var data=null, loading=null, sel=-1, hits=[];
  var SKIP=/\/(docs\/sample|credits|tags|categories|authors|series)\//i;
  function load(){
    if(data) return Promise.resolve(data);
    if(!loading) loading=fetch('/index.json').then(function(r){return r.json();}).then(function(d){
      data=d.filter(function(x){return x.content && x.permalink && !SKIP.test(x.permalink+'/');});
      return data;
    }).catch(function(){ data=[]; return data; });
    return loading;
  }
  function esc(t){return t.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function hl(t,terms){
    var out=esc(t);
    terms.forEach(function(w){ if(!w) return; out=out.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),function(m){return '<mark>'+m+'</mark>';}); });
    return out;
  }
  function clean(c){
    return c.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'")
      .replace(/\$\$[\s\S]*?\$\$/g,' ').replace(/\$[^$\n]*\$/g,' ').replace(/\\[a-zA-Z]+/g,' ')
      .replace(/[#*_>`|]/g,' ').replace(/\s+/g,' ').trim();
  }
  function snippet(c,w){
    c=clean(c);
    var i=c.toLowerCase().indexOf(w);
    if(i<0) return c.slice(0,140);
    var a=Math.max(0,i-50);
    return (a?'… ':'')+c.slice(a,a+150);
  }
  function where(p){
    var zh=SiteLang.get()==='zh';
    for(var k in NAMES){ if(p.indexOf(k)===0) return NAMES[k][zh?'zh':'en']; }
    p=decodeURIComponent(p).replace(/^\/|\/$/g,'').split('/');
    if(p[0]==='finance') return zh?'研究':'Research';
    if(p[0]==='docs'&&p[1]==='uoft'&&p[3]) return p[3].replace(/-+/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase();});
    return p.length>1 ? p[1].replace(/-+/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase();}) : '';
  }
  function render(){
    var v=q.value.trim().toLowerCase();
    if(!v){ box.classList.remove('open'); box.innerHTML=''; return; }
    var terms=v.split(/\s+/);
    hits=data.map(function(x){
      var t=x.title.toLowerCase(), c=x.content.toLowerCase(), s=0;
      for(var i=0;i<terms.length;i++){
        var w=terms[i];
        if(t.indexOf(w)>=0) s+=10; else if(c.indexOf(w)>=0) s+=1; else return null;
      }
      return {x:x,s:s};
    }).filter(Boolean).sort(function(a,b){return b.s-a.s;}).slice(0,8);
    sel=-1;
    if(!hits.length){ box.innerHTML='<div class="none">'+(SiteLang.get()==='zh'?'没有找到“'+esc(q.value.trim())+'”':'No matches for “'+esc(q.value.trim())+'”')+'</div>'; box.classList.add('open'); return; }
    box.innerHTML=hits.map(function(h){
      var x=h.x;
      return '<a href="'+x.permalink+'"><div class="srt"><b>'+hl(x.title,terms)+'</b><span>'+esc(where(x.permalink))+(x.date?' · '+esc(x.date):'')+'</span></div><p>'+hl(snippet(x.content,terms[0]),terms)+'</p></a>';
    }).join('');
    box.classList.add('open');
  }
  function mark(){
    var as=box.querySelectorAll('a');
    as.forEach(function(a,i){a.classList.toggle('on',i===sel);});
    if(as[sel]) as[sel].scrollIntoView({block:'nearest'});
  }
  q.addEventListener('focus',load);
  q.addEventListener('input',function(){ load().then(render); });
  q.addEventListener('keydown',function(e){
    var n=box.querySelectorAll('a').length;
    if(e.key==='ArrowDown'&&n){ sel=(sel+1)%n; mark(); e.preventDefault(); }
    else if(e.key==='ArrowUp'&&n){ sel=(sel-1+n)%n; mark(); e.preventDefault(); }
    else if(e.key==='Enter'){ var a=box.querySelectorAll('a')[sel<0?0:sel]; if(a){ location.href=a.href; e.preventDefault(); } }
    else if(e.key==='Escape'){ q.value=''; render(); q.blur(); }
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='/'&&document.activeElement!==q&&!/input|textarea/i.test(document.activeElement.tagName)){ e.preventDefault(); q.focus(); }
  });
  document.addEventListener('click',function(e){ if(!e.target.closest('.search')) box.classList.remove('open'); });
  q.addEventListener('focus',function(){ if(q.value.trim()&&box.innerHTML) box.classList.add('open'); });
})();
</script>
